name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5.0.0
        with:
          # sprintf-js has no patched release for this moderate DoS, which
          # needs an attacker-controlled format string. It reaches only the
          # engine's eve example through just-bash. Remove once a fix ships.
          allow-ghsas: GHSA-hp3w-g68c-fv3c
