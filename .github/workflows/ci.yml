name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit npm dependencies
        run: |
          npm audit --audit-level=high
          (cd starters/react && npm ci && npm audit --audit-level=high)
      - run: npm test
      - name: Check JavaScript syntax
        run: |
          for file in bin/bimo src/*.mjs test/*.mjs; do
            node --check "$file"
          done
      - run: npm pack --dry-run
      - run: docker build --tag bimo-workflow:ci .
      - name: Scan the CI image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bimo-workflow:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - run: docker run --rm bimo-workflow:ci list --json
      - run: docker run --rm bimo-workflow:ci validate react-app --json
      - run: docker run --rm bimo-workflow:ci validate react-solo --json
      - run: docker run --rm bimo-workflow:ci validate parallel-engineering-pod --json
      - name: Prove the baked React starter works offline
        run: |
          starter_volume="bimo-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$starter_volume"
          trap 'docker volume rm "$starter_volume"' EXIT
          docker run --rm --user 0:0 --entrypoint chown \
            --mount "type=volume,source=$starter_volume,target=/workspace" \
            bimo-workflow:ci -R 1000:1000 /workspace
          docker run --rm --network none \
            --mount "type=volume,source=$starter_volume,target=/workspace" \
            bimo-workflow:ci bootstrap
          for command in test build smoke; do
            docker run --rm --network none --workdir /workspace --entrypoint npm \
              --mount "type=volume,source=$starter_volume,target=/workspace" \
              bimo-workflow:ci run "$command"
          done
  verify-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check JavaScript syntax
        run: |
          for file in bin/bimo src/*.mjs test/*.mjs; do
            node --check "$file"
          done
