name = "agent-worker-demo"
trusted_executable_roots = ["/usr/bin"]
[[pods]]
name = "planner"
engine = "fixture"
command = ["/usr/bin/env", "node", "workers/fixture/fixture-worker.mjs"]
allowed_env = ["PATH"]
destinations = ["worker"]
[[pods]]
name = "worker"
engine = "fixture"
command = ["/usr/bin/env", "node", "workers/fixture/fixture-worker.mjs"]
allowed_env = ["PATH"]
capabilities = ["pod.send_message", "factory.read_state"]
destinations = ["planner"]
